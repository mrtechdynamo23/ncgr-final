    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23074A76'/%3E%3Ctext x='50%25' y='52%25' text-anchor='middle' dominant-baseline='central' fill='white' font-family='Arial' font-weight='700' font-size='16'%3EN%3C/text%3E%3C/svg%3E" />
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === 'p' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).filter(function(s) {
            return s.slice(0, 2) === 'p='
          })[0].slice(2);
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
